name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: beep-software/beep-client

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=${REGISTRY}/${IMAGE_NAME}
          TAG=${GITHUB_SHA}

          docker build \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            .

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Deploy to k3s
        if: github.event_name == 'push'
        run: |
          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
            set image deployment/beep-client \
            beep-client="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml \
            rollout status deployment/beep-client \
            --timeout=5m